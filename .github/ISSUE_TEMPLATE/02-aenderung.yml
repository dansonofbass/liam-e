name: Änderung vorschlagen
description: Neues Verhalten oder eine Änderung an bestehendem Verhalten.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Nur synthetische Beispiele. Keine Zugangsdaten, echten Mails, Mistral-IDs oder lokalen Pfade.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Was heute fehlt oder stört, belegt am aktuellen Code (Datei und Funktion).
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Vorschlag
      description: Gewünschtes Verhalten aus Sicht der Nutzung, dazu betroffene Routen, Tabellen und Ansichten.
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Nicht enthalten
  - type: checkboxes
    id: contracts
    attributes:
      label: Betroffene Verträge
      options:
        - label: API (OpenAPI-Spezifikation und generierter Client)
        - label: Tabellen (generierte Migration)
        - label: MCP-Inventur (neue verändernde Operation)
        - label: Agent darf Neues vorschlagen (Bestätigung über Vorschlagskarte)
        - label: Texte der Oberfläche (DESIGN.md, Textkatalog)
  - type: textarea
    id: acceptance
    attributes:
      label: Abnahmekriterien
      description: Prüfbare Aussagen, je eine Zeile, dazu mindestens ein Negativfall.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Prüfung
      description: Tests oder Befehle, die die Kriterien belegen; was nur live prüfbar ist, ausdrücklich nennen.
    validations:
      required: true
