name: Fehler melden
description: Etwas verhält sich anders, als AGENTS.md, DESIGN.md oder ein Issue es beschreibt.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Nur synthetische Daten oder die Seed-Daten aus `api.mail.dev_seed`. Keine Zugangsdaten,
        Tokens, echten Mails oder Termine, Mistral-IDs, lokalen Pfade oder rohen Providerantworten.
        Eine vermutete Schwachstelle vertraulich melden (SECURITY.md), nicht hier.
  - type: textarea
    id: observed
    attributes:
      label: Beobachtetes Verhalten
      description: Was passiert, mit Statuscode oder angezeigtem Text, sofern vorhanden.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Erwartetes Verhalten und Quelle
      description: Was stattdessen passieren soll und wo das festgelegt ist (AGENTS.md, DESIGN.md, Issue, Spec).
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Schritte zur Reproduktion
      description: Mit Seed-Daten oder erfundenen Werten.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Stand
      description: Commit oder Datum, lokal oder Studio-Deployment.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Bereich
      options:
        - Oberfläche (apps/web)
        - API (apps/api)
        - Abruf und Provider
        - Agent und Chat
        - Datenbank und Migration
        - CI und Werkzeuge
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Abnahmekriterien
      description: Woran ein Reviewer erkennt, dass der Fehler behoben ist, und mit welchem Test oder Befehl.
    validations:
      required: true
