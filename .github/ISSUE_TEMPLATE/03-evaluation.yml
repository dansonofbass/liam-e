name: Evaluation vorbereiten
description: Eine Fähigkeit, einen Anbieter oder einen Ansatz prüfen, bevor er umgesetzt wird.
title: "Eval: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Eine Evaluation ist kein Auftrag zur Umsetzung, zu neuen Zugängen oder zu Live-Proben mit echten Daten.
        Versionen und Primärquellen zum Zeitpunkt der Prüfung nachsehen. Keine privaten Daten ins Issue.
  - type: textarea
    id: question
    attributes:
      label: Entscheidungsfrage und Nutzen
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Ist-Zustand im Code
      description: Geprüfter Commit, betroffene Module und vorhandene Verträge.
    validations:
      required: true
  - type: textarea
    id: candidates
    attributes:
      label: Kandidaten und einfachste Alternative
      description: Mit Primärquellen (Herstellerdoku, Spezifikation) und Versionen.
    validations:
      required: true
  - type: textarea
    id: access
    attributes:
      label: Zugang, Daten und Grenzen
      description: Welche Zugänge eine Probe braucht, welche Daten sie berührt (nur synthetisch oder eigens angelegte Testquellen), was ausdrücklich nicht passieren darf.
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Annahme- und Ablehnungskriterien
      description: Vor der Prüfung festlegen; ein fehlender Nachweis gibt keine Fähigkeit frei.
    validations:
      required: true
  - type: textarea
    id: breakdown
    attributes:
      label: Teilaufträge und Reihenfolge
      description: Optional; Abhängigkeiten als Issue-Verweise.
