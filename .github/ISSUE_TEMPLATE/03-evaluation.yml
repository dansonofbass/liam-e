name: Prepare an evaluation
description: Evaluate a capability, provider or approach before implementing it.
title: "Eval: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        An evaluation is not authorization to implement, obtain new access or run live probes with real data.
        Check versions and primary sources at the time of evaluation. No private data in the issue.
  - type: textarea
    id: question
    attributes:
      label: Decision question and benefit
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current state in code
      description: Commit checked, affected modules and existing contracts.
    validations:
      required: true
  - type: textarea
    id: candidates
    attributes:
      label: Candidates and simplest alternative
      description: Include primary sources (vendor documentation, specification) and versions.
    validations:
      required: true
  - type: textarea
    id: access
    attributes:
      label: Access, data and limits
      description: Access needed for a probe, data it touches (synthetic or specially created test sources only), and what must explicitly not happen.
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance and rejection criteria
      description: Define before evaluation; missing evidence does not authorize a capability.
    validations:
      required: true
  - type: textarea
    id: breakdown
    attributes:
      label: Subtasks and order
      description: Optional; dependencies as issue references.
