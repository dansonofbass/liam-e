<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mistral Chat</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; background: #f5f5f7; color: #1a1a1a; }
    main { max-width: 720px; margin: 0 auto; padding: 24px 16px; display: flex; flex-direction: column; height: 100vh; }
    h1 { font-size: 1.25rem; margin: 0 0 16px; }
    #log { flex: 1; overflow-y: auto; background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 16px; }
    .msg { margin-bottom: 12px; padding: 10px 12px; border-radius: 8px; max-width: 85%; white-space: pre-wrap; }
    .user { background: #e8f0fe; margin-left: auto; }
    .assistant { background: #f0f0f0; }
    .error { background: #fdecea; color: #b3261e; }
    form { display: flex; gap: 8px; margin-top: 12px; }
    input { flex: 1; padding: 10px 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; }
    button { padding: 10px 18px; border: none; border-radius: 8px; background: #1a1a1a; color: #fff; font-size: 1rem; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: default; }
  </style>
</head>
<body>
  <main>
    <h1>Mistral Chat (mistral-small-latest)</h1>
    <div id="log"></div>
    <form id="form">
      <input id="input" type="text" placeholder="Nachricht schreiben …" autocomplete="off" required />
      <button id="send" type="submit">Senden</button>
    </form>
  </main>
  <script>
    const log = document.getElementById("log");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const history = [];

    function addMessage(role, text, cls) {
      const div = document.createElement("div");
      div.className = "msg " + (cls || role);
      div.textContent = text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      send.disabled = true;
      addMessage("user", text);
      history.push({ role: "user", content: text });
      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: history })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Fehler " + res.status);
        addMessage("assistant", data.reply);
        history.push({ role: "assistant", content: data.reply });
      } catch (err) {
        addMessage("error", err.message, "error");
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
